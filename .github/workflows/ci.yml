name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]   # react-router v7 requires Node >= 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: auramind-gemini/package-lock.json

      - name: Install dependencies
        run: |
          cd auramind-gemini
          npm ci

      - name: Run type check
        run: |
          cd auramind-gemini
          npm run type-check

      - name: Run tests
        run: |
          cd auramind-gemini
          npm test -- --run

      - name: Install API dependencies
        run: |
          cd api
          npm ci

      - name: API type check
        run: |
          cd api
          npx tsc --noEmit

      - name: Run API tests
        run: |
          cd api
          npm test

      - name: Build project
        run: |
          cd auramind-gemini
          npm run build

      - name: Check initial-load bundle size
        run: |
          cd auramind-gemini
          node scripts/check-bundle-size.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.node-version }}
          path: auramind-gemini/dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: auramind-gemini/package-lock.json

      - name: Install dependencies
        run: |
          cd auramind-gemini
          npm ci

      - name: Install Playwright browsers
        run: |
          cd auramind-gemini
          npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: |
          cd auramind-gemini
          npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: auramind-gemini/test-results
          retention-days: 7

  android-build:
    # Smoke check that the Capacitor Android project still compiles. Runs on
    # every push/PR so a breakage in the mobile web bundle or native shell is
    # caught immediately — the full signed-release + Play upload pipeline lives
    # in mobile-android.yml (tag/manual gated, needs store secrets).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: auramind-gemini/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: |
          cd auramind-gemini
          npm ci

      - name: Build mobile web bundle + sync Capacitor
        run: |
          cd auramind-gemini
          npm run build:android

      - name: Compile debug APK (no release secrets required)
        run: |
          cd auramind-gemini/android
          ./gradlew assembleDebug

      - name: Compile Wear OS app + unit tests
        run: |
          cd auramind-gemini/android
          ./gradlew :wear:testDebugUnitTest :wear:assembleDebug