name: Mobile iOS

# Builds the iOS app for the simulator on a GitHub-hosted Mac, launches it in
# an iPhone simulator and uploads a screenshot plus the app's log. The tour's
# last step drives a real Live Activity (start + update) and the job fails
# unless the plugin confirms both — the Dynamic Island layout proof. No Apple
# Developer account or signing is needed for this; TestFlight uploads come
# later as a separate, signed job.

on:
  pull_request:
    paths:
      - 'auramind-gemini/**'
      - '.github/workflows/mobile-ios.yml'
  push:
    branches: [main]
    paths:
      - 'auramind-gemini/**'
      - '.github/workflows/mobile-ios.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Live reload: load the web app from this URL instead of the bundle (e.g. https://your-preview.vercel.app or http://192.168.1.20:3000). Leave empty for a normal build.'
        required: false
        default: ''

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45

    permissions:
      contents: read

    defaults:
      run:
        working-directory: auramind-gemini

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: auramind-gemini/package-lock.json

      # Same public build values as the Android release. Secrets are absent
      # on Dependabot and fork PRs; the app still builds and boots to its
      # welcome screen with placeholders, which is all this job checks.
      - name: Write build env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          {
            printf 'VITE_SUPABASE_URL=%s\n'           "${VITE_SUPABASE_URL:-https://placeholder.supabase.co}"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n'      "${VITE_SUPABASE_ANON_KEY:-placeholder}"
            printf 'VITE_STRIPE_PUBLISHABLE_KEY=%s\n' "${VITE_STRIPE_PUBLISHABLE_KEY:-}"
            printf 'VITE_API_BASE_URL=%s\n'           'https://auramind.app'
            printf 'VITE_SSE_BASE=%s\n'               'https://auramind.app'
            printf 'VITE_APP_URL=%s\n'                'https://auramind.app'
            printf 'VITE_USE_PUTER=%s\n'              'true'
            printf 'VITE_TURNSTILE_SITE_KEY=%s\n'     '0x4AAAAAAAEsHm7dsqEhBi3Nr'
          } > .env
          echo "Wrote .env with $(grep -c '=' .env) entries (values not echoed)."

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle and sync iOS
        run: npm run build:ios

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | tail -5

      - name: Build for the iOS simulator (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/xcodebuild.log | grep -E "error:|warning: .*AuraListen|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/ios/Build/Products/Debug-iphonesimulator/App.app

      - name: Launch in an iPhone simulator and screenshot
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j \
            | node -e "const d=JSON.parse(require('fs').readFileSync(0)).devices;const all=Object.entries(d).filter(([r])=>r.includes('iOS')).flatMap(([,v])=>v);const p=all.find(x=>/^iPhone \d+ Pro( Max)?$/.test(x.name))||all.find(x=>/^iPhone \d+( Pro)?$/.test(x.name))||all.find(x=>x.name.startsWith('iPhone'));console.log(p.udid)")
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.auramind.app
          sleep 25
          mkdir -p ../ios-artifacts
          xcrun simctl io "$DEVICE" screenshot ../ios-artifacts/launch.png
          # Still running 25 s after launch = no crash on start.
          if xcrun simctl spawn "$DEVICE" launchctl list | grep -q "com.auramind.app"; then
            echo "App is running."
          else
            echo "::error::App is not running after launch (crashed?)"
            xcrun simctl spawn "$DEVICE" log show --last 2m --predicate 'process == "App"' > ../ios-artifacts/app.log || true
            exit 1
          fi
          xcrun simctl spawn "$DEVICE" log show --last 2m --predicate 'process == "App"' > ../ios-artifacts/app.log || true
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      # Same app, built with VITE_IOS_PREVIEW=true: it opens on sample-data
      # screens and walks through them by itself (IOSVisualPreview's tour),
      # so every screen can be photographed without an account or taps.
      - name: Screenshot every iOS screen (sample data)
        run: |
          set -euo pipefail
          echo 'VITE_IOS_PREVIEW=true' >> .env
          npx vite build --mode mobile
          npx cap copy ios
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build > build/xcodebuild-preview.log
          xcrun simctl terminate "$DEVICE" com.auramind.app || true
          xcrun simctl install "$DEVICE" build/ios/Build/Products/Debug-iphonesimulator/App.app
          mkdir -p ../ios-artifacts/screens
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 --force ../ios-artifacts/screens/tour.mp4 &
          REC=$!
          xcrun simctl launch "$DEVICE" com.auramind.app
          # The tour shows a screen every 6 s once the app has loaded (10
          # steps incl. the Live Activity finale); shooting every 3 s catches
          # each one at least once.
          for i in $(seq -w 1 24); do
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "../ios-artifacts/screens/shot-$i.png" >/dev/null
          done
          kill -INT "$REC" || true
          wait "$REC" || true

      # The tour's last step holds a live study session with a real ActivityKit
      # session (start + update, never ended). Photograph the Dynamic Island
      # and fail closed if the plugin never confirmed start+update — that is
      # the layout proof the type checker can't give.
      - name: Drive a Live Activity and photograph it
        run: |
          set -euo pipefail
          xcrun simctl io "$DEVICE" screenshot ../ios-artifacts/screens/live-activity.png
          sleep 5
          xcrun simctl io "$DEVICE" screenshot ../ios-artifacts/screens/live-activity-updated.png
          xcrun simctl spawn "$DEVICE" log show --last 5m --predicate 'process == "App"' > ../ios-artifacts/live-activity.log || true
          grep -q "LIVE_ACTIVITY_STARTED:true" ../ios-artifacts/live-activity.log || {
            echo "::error::Live Activity never started (missing LIVE_ACTIVITY_STARTED:true in the app log)"
            exit 1
          }
          grep -q "LIVE_ACTIVITY_UPDATED:true" ../ios-artifacts/live-activity.log || {
            echo "::error::Live Activity never updated (missing LIVE_ACTIVITY_UPDATED:true in the app log)"
            exit 1
          }
          echo "Live Activity started and updated."

      - name: Upload screenshot and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator
          path: |
            ios-artifacts
            auramind-gemini/build/xcodebuild*.log
          if-no-files-found: ignore

  # An unsigned device build, for putting the app on a real iPhone without a
  # Mac and without an Apple Developer Program membership: download the
  # artifact on Windows and let Sideloadly (or AltStore) sign it with a free
  # Apple ID over USB. Signatures from a free account last 7 days.
  #
  # Two things matter for this app in particular:
  #   - the widget extension rides along inside App.app/PlugIns, so the Live
  #     Activity works; the sideloader must not strip app extensions.
  #   - the Live Activity is requested with pushType: nil, which is what lets
  #     it run under a free "personal team" signature at all: a push token
  #     needs an APNs entitlement that free accounts do not get.
  #
  # `build` rather than `archive`: with signing off, archiving does not
  # reliably place App.app inside the .xcarchive on recent Xcode, so the IPA
  # is packaged by hand from the build products.
  ios-device-ipa:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45

    permissions:
      contents: read

    defaults:
      run:
        working-directory: auramind-gemini

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: auramind-gemini/package-lock.json

      - name: Write build env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://placeholder.supabase.co}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-placeholder}"
            echo "VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY:-}"
            echo "VITE_API_BASE_URL=https://auramind.app"
            echo "VITE_SSE_BASE=https://auramind.app"
            echo "VITE_APP_URL=https://auramind.app"
            echo "VITE_USE_PUTER=true"
            echo "VITE_TURNSTILE_SITE_KEY=0x4AAAAAAAEsHm7dsqEhBi3Nr"
          } > .env
          echo "Wrote .env with $(grep -c '=' .env) entries (values not echoed)."

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle and sync iOS
        run: npm run build:ios

      # The Expo-Go-shaped trick: point the shell at a URL instead of its own
      # bundled files. Sideload this once and every web change shows up with a
      # pull-to-refresh — only Swift changes need a new IPA after that.
      - name: Load the web app from a live server
        if: inputs.server_url != ''
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const path = "ios/App/App/capacitor.config.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            const url = process.env.SERVER_URL.trim().replace(/\/+$/, "");
            if (!/^https?:\/\//.test(url)) throw new Error("server_url must start with http:// or https://");
            config.server = { ...(config.server || {}), url, cleartext: url.startsWith("http://") };
            fs.writeFileSync(path, JSON.stringify(config, null, 2));
            console.log("Loading the web app from", url);
          '
          # iOS blocks plain HTTP by default, so a LAN dev server needs an
          # exception and the local-network prompt. HTTPS needs neither.
          case "$SERVER_URL" in
            http://*)
              plutil -insert NSAppTransportSecurity -json '{"NSAllowsLocalNetworking": true}' ios/App/App/Info.plist
              plutil -insert NSLocalNetworkUsageDescription \
                -string 'AuraMind loads its development server from your local network.' \
                ios/App/App/Info.plist
              echo "Added a local-network exception for a plain-HTTP dev server."
              ;;
          esac

      - name: Build for a real device (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build/xcodebuild-device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/device/Build/Products/Release-iphoneos/App.app

      - name: Package the IPA
        run: |
          set -euo pipefail
          APP=build/device/Build/Products/Release-iphoneos/App.app
          # The Live Activity is useless if the extension did not come along.
          if [ ! -d "$APP/PlugIns/AuraMindWidgets.appex" ]; then
            echo "::error::widget extension missing from the app bundle"
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry AuraMind-unsigned.ipa Payload
          ls -lh AuraMind-unsigned.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.server_url != '' && 'auramind-ios-live-reload-ipa' || 'auramind-ios-unsigned-ipa' }}
          path: auramind-gemini/build/AuraMind-unsigned.ipa
          if-no-files-found: error
